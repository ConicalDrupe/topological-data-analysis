[project]
name = "gemmagenerateembeddings"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.25.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "safetensors>=0.8.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_embeddings"]

[project]
name = "topological-data-analysis"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "giotto-tda",
    "pandas",
    "matplotlib",
    "scikit-image>=0.26.0",
    "opencv-python>=4.11.0.86",
    "torchxrayvision>=1.5.2",
    "pywavelets>=1.9.0",
    "huggingface-hub>=1.25.1",
    "safetensors>=0.8.0",
    "torch>=2.13.0",
    "transformers>=4.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tda_chexpr", "GenerateEmbeddings/src/gemma_embeddings"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[project]
name = "topological-data-analysis"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "giotto-tda",
    "pandas",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tda_chexpr"]

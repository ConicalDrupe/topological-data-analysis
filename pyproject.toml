[project]
name = "topological-data-analysis"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "giotto-tda",
    "pandas",
    "matplotlib",
    "scikit-image>=0.26.0",
    "opencv-python>=4.11.0.86",
    "torchxrayvision>=1.5.2",
    "pywavelets>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tda_chexpr"]
